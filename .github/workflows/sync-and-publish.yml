name: Sync and publish
on:
    schedule:
        - cron: "17 0 * * *"
    workflow_dispatch:
        inputs:
            bootstrap:
                description: Publish the preceding stable release to initialize npm
                type: boolean
                default: false
concurrency:
    group: type-fest-release
    cancel-in-progress: false
permissions:
    contents: read
jobs:
    release:
        if: github.repository == 'studiorafa/rbxts-type-fest' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: write
            id-token: write
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  ref: main
                  fetch-depth: 1
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: "24"
                  registry-url: https://registry.npmjs.org/
                  package-manager-cache: false
            - run: npm install --global npm@11.19.0
            - run: npm ci --ignore-scripts
            - run: npm run verify
            - name: Bootstrap with temporary npm token
              if: inputs.bootstrap == true
              run: npm run release
              env:
                  BOOTSTRAP: "true"
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
            - name: Publish through trusted publishing
              if: inputs.bootstrap != true
              run: npm run release
              env:
                  PUBLISH_ENABLED: ${{ vars.PUBLISH_ENABLED }}
